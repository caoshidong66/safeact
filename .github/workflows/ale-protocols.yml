name: ALE V0-V3 integration

on:
  pull_request:
    paths: ['integrations/ale/**', 'tests/test_ale*.py', '.github/workflows/ale-protocols.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safeact-ale-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  protocols:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [regressions, 0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checkout the validated ALE schema revision
        uses: actions/checkout@v4
        with:
          repository: rdi-berkeley/agents-last-exam
          ref: d9abc0734b56ea34116c5bfcbdd0b808269ab9e2
          path: work/ale-schema
      - run: python -m pip install pytest ruff requests 'pydantic>=2,<3'
      - name: Lint
        run: |
          python -m ruff check integrations/ale tests/test_ale*.py
          python -m ruff format --check integrations/ale tests/test_ale*.py
      - name: Protocol regressions
        if: matrix.group == 'regressions'
        env:
          PYTHONPATH: ${{ github.workspace }}/work/ale-schema
          SAFEACT_REQUIRE_ALE_SCHEMA: '1'
        run: python -m pytest tests/test_ale_adapter.py tests/test_ale_protocols.py -q -k 'not test_every_released_execution_reference_roundtrips' --junitxml=work/ale-tests.xml
      - name: All released V0-V3 reference shard
        if: matrix.group != 'regressions'
        env:
          PYTHONPATH: ${{ github.workspace }}/work/ale-schema
          SAFEACT_REQUIRE_ALE_SCHEMA: '1'
          SAFEACT_CASE_SHARD_COUNT: '8'
          SAFEACT_CASE_SHARD_INDEX: ${{ matrix.group }}
        run: python -m pytest tests/test_ale_protocols.py -q -k test_every_released_execution_reference_roundtrips --junitxml=work/ale-tests.xml
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ale-protocol-validation-${{ matrix.group }}
          path: work/ale-tests.xml
